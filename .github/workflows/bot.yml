# Запуск бота на GitHub Actions. Один запуск живёт ~5 ч 45 мин, затем сохраняет базу
# и сам запускает следующий. Расписание — запасной перезапуск, если цепочка оборвалась.
name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check secrets
        id: check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::Секрет BOT_TOKEN не задан — бот не запущен. См. README."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Restore database
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: giftbot.db
          key: giftbot-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: giftbot-db-

      - name: Run bot
        if: steps.check.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          ADMINS: ${{ secrets.ADMINS }}
          SLUG_OVERRIDES: ${{ vars.SLUG_OVERRIDES }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PREMIUM_PRICE: ${{ vars.PREMIUM_PRICE }}
          PREMIUM_DAYS: ${{ vars.PREMIUM_DAYS }}
          RUN_SECONDS: "20700"
        run: python -m giftbot

      - name: Save database
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: giftbot.db
          key: giftbot-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start next run
        if: success() && steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}"
